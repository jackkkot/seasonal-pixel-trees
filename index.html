<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>秋樹</title>
    <meta
      name="description"
      content="湖畔黃昏的一棵秋樹。點一下樹冠，會再落下一些葉子，落盡後可以再長回來。"
    />
    <link rel="preload" as="image" href="assets/sky.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <figure class="stage">
        <canvas
          id="scene"
          width="1254"
          height="1254"
          tabindex="0"
          role="button"
          aria-label="秋樹。點一下會落下一些葉子，多點幾次才會落盡；落盡後再點一次，葉子長回來。"
        ></canvas>
        <figcaption class="hud">
          <div class="copy">
            <p class="eyebrow">湖畔黃昏</p>
            <h1>秋樹</h1>
            <p id="status" class="status" role="status">畫面載入中。</p>
          </div>
          <div class="controls">
            <button type="button" id="drop">搖落葉子</button>
            <button type="button" id="grow">重新長葉</button>
          </div>
          <p class="help">點一下樹冠，會再搖落一些葉子。多點幾次，樹冠才會落盡。落盡後再點一次，葉子長回來。</p>
        </figcaption>
      </figure>
      <noscript><p>需要開啟 JavaScript，葉子才會落下來。</p></noscript>
    </main>
    <script src="tree.js"></script>
  </body>
</html>
